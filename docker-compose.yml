version: '3.8'
services:
  backend-ardiartax:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ardiartax_backend
    ports:
      - "3032:3032"
    env_file:
      - .env
    restart: always
    depends_on:
      - db-ardiartax

  db-ardiartax:
    image: postgres:15
    container_name: ardiartax_db
    restart: always
    environment:
      POSTGRES_USER: ardiartax
      POSTGRES_PASSWORD: bukankaumdajal666
      POSTGRES_DB: ardiartax_db
    ports:
      - "3030:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer-ardiartax:
    image: adminer
    container_name: ardiartax_adminer
    restart: always
    ports:
      - "3031:8080"
    depends_on:
      - db-ardiartax

  # 💡 SERVICE BARU: Otomatis Backup Database
  backup-db-ardiartax:
    image: prodrigestivill/postgres-backup-local:15
    container_name: ardiartax_backup
    restart: always
    environment:
      POSTGRES_HOST: db-ardiartax
      POSTGRES_USER: ardiartax
      POSTGRES_PASSWORD: bukankaumdajal666
      POSTGRES_DB: ardiartax_db
      # Penjadwalan: Eksekusi setiap hari jam 00:00 (Format Cron)
      POSTGRES_EXTRA_OPTS: "-F c" # Format kompresi PostgreSQL custom (lebih hemat size)
      SCHEDULE: "@daily" 
      BACKUP_KEEP_DAYS: 7 # Menyimpan history backup selama 7 hari terakhir, selebihnya dihapus otomatis
    volumes:
      - ./database:/var/xray/postgres-backup # Hubungkan folder luar ./database ke penampungan backup kontainer
    depends_on:
      - db-ardiartax

volumes:
  postgres_data: